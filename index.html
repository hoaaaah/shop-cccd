    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            const htmlElement = document.documentElement;

            // Khởi tạo themeMode từ localStorage hoặc mặc định
            let defaultThemeMode = "light"; // Mặc định là giao diện sáng
            let themeMode = localStorage.getItem("data-bs-theme") || defaultThemeMode;

            applyTheme(themeMode); // Áp dụng giao diện ban đầu

            // Lắng nghe sự kiện click vào nút chuyển đổi
            themeToggleBtn.addEventListener('click', function() {
                // Chuyển đổi giữa dark và light
                themeMode = themeMode === "light" ? "dark" : "light";
                localStorage.setItem("data-bs-theme", themeMode); // Lưu trạng thái vào localStorage
                applyTheme(themeMode); // Áp dụng giao diện mới
            });

            function applyTheme(theme) {
                // Cập nhật giao diện trên HTML
                htmlElement.setAttribute("data-bs-theme", theme);

                // Hiển thị icon phù hợp
                const lightIcon = document.querySelector('.theme-light-show');
                const darkIcon = document.querySelector('.theme-dark-show');

                if (theme === "dark") {
                    lightIcon.style.display = "none";
                    darkIcon.style.display = "inline";
                } else {
                    lightIcon.style.display = "inline";
                    darkIcon.style.display = "none";
                }
            }
        });
    </script>

    <script>
        function closeThongBao() {
            $('.thong-bao-popup, .thong-bao-overlay').fadeOut();
        }
        // Hàm hiển thị thông báo thành công
        function showSuccessPopup(message) {
            $('#successThongBao .thong-bao-popup-message').text(message);
            $('#successThongBao, #thongBaoOverlay').fadeIn();
        }
        // Hàm hiển thị thông báo thất bại
        function showErrorPopup(message) {
            $('#errorThongBao .thong-bao-popup-message').text(message);
            $('#errorThongBao, #thongBaoOverlay').fadeIn();
        }
    </script>
        <script>
        $(document).ready(function() {
            $('.btn-outline-primary').on('click', function() {
                $('#anh3x4').click(); // Kích hoạt input file
            });

            // Khi chọn tệp, hiển thị ảnh xem trước
            $('#anh3x4').on('change', function(e) {
                const file = e.target.files[0]; // Lấy file đã chọn
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        // Thêm hình ảnh vào khu vực hiển thị
                        const imagePreview = `
                            <img src="${e.target.result}" class="img-fluid rounded mt-3" style="max-height: 150px; width: auto; border: 1px solid #ddd; border-radius: 10px;" alt="Ảnh Xem Trước">
                        `;
                        $('.upload-area').html(imagePreview); // Thay thế nội dung của upload-area
                    };
                    reader.readAsDataURL(file); // Đọc tệp ảnh dưới dạng URL
                } else {
                    alert('Không thể đọc tệp. Vui lòng thử lại.');
                }
            });

            // Thiết lập CSRF token cho tất cả các yêu cầu AJAX
            $.ajaxSetup({
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
                }
            });

            // Xử lý gửi dữ liệu form qua AJAX
            $('#kt_contact_form').on('submit', function(e) {
                e.preventDefault();

                // Tạo đối tượng FormData
                var formData = new FormData();

                // Thêm dữ liệu từ các trường vào FormData
                formData.append('ho_va_ten', $('#hoVaTen').val());
                formData.append('so_cccd', $('#soCccd').val());
                formData.append('ngay_sinh', $('#ngaySinh').val());
                formData.append('ngay_het_han', $('#ngayHetHan').val());
                formData.append('que_quan_tren', $('#queQuanTren').val());
                formData.append('que_quan_duoi', $('#queQuanDuoi').val());
                formData.append('thuong_tru_tren', $('#thuongTruTren').val());
                formData.append('thuong_tru_duoi', $('#thuongTruDuoi').val());
                formData.append('gioi_tinh', $('#gioiTinh').val());
                formData.append('quoc_tich', $('#quocTich').val());
                formData.append('ngay_cap', $('#ngayCap').val());
                formData.append('idvnm', $('#idvnm').val());

                // Kiểm tra và thêm file ảnh vào FormData
                var fileInput = $('#anh3x4')[0].files[0];
                if (fileInput) {
                    formData.append('anh3x4', fileInput); // 'anh3x4' là tên trường gửi file
                } else {
                    showErrorPopup('Vui lòng tải lên ảnh CCCD 3x4');
                    return;
                }

                // Gửi AJAX request
                $.ajax({
                    url: '', // URL xử lý
                    type: 'POST',
                    data: formData,
                    contentType: false, // Không mã hóa dữ liệu
                    processData: false, // Không xử lý dữ liệu thành chuỗi query
                    dataType: 'json',
                    success: function(response) {
                        if (response.status === 1) {
                            // Hiển thị ảnh tạo thành công
                            $('#img-mat-truoc').attr('src', 'data:image/jpeg;base64,' + response
                                .img_mat_truoc);
                            $('#download-button-mat-truoc').attr('href', 'data:image/jpeg;base64,' +
                                response.img_mat_truoc);
                            $('#img-mat-sau').attr('src', 'data:image/jpeg;base64,' + response
                                .img_mat_sau);
                            $('#download-button-mat-sau').attr('href', 'data:image/jpeg;base64,' +
                                response.img_mat_sau);
                            // Cuộn tới phần hiển thị ảnh
                            $('html, body').animate({
                                    scrollTop: $('#imgcccd').offset().top
                                },
                                800
                            );
                            showSuccessPopup('Tạo CCCD thành công.');
                        } else {
                            showErrorPopup(response.msg ||
                                'Có lỗi xảy ra khi tạo CCCD. Vui lòng thử lại.');
                        }
                    },
                    error: function() {
                        showErrorPopup('Không thể kết nối đến server. Vui lòng thử lại sau.');
                    },
                });
            });
        });
    </script>
